    function formatDateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getDayIndex(dateObj) {
      const diffTime = dateObj.getTime() - START_DATE.getTime();
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    }

    // Synthesized Web Audio
    let audioCtx = null;
    function playAudioTone(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.35);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === 'tap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'timer') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.6);
        }
      } catch (e) {}
    }

          const saved = localStorage.getItem('orbit_fitness_react_settings');
          const parsed = saved ? JSON.parse(saved) : {};
          const url = (parsed.webhookUrl && parsed.webhookUrl.trim() !== '') ? parsed.webhookUrl : LIVE_WEBHOOK;
          return {
            sheetUrl: parsed.sheetUrl || 'https://docs.google.com/spreadsheets/d/1FpP5YviT1YBAltadBppLr7EpzoiSeE3woNHOtRo0OoY/edit',
            webhookUrl: url
          };
        } catch (e) {
          return {
            sheetUrl: 'https://docs.google.com/spreadsheets/d/1FpP5YviT1YBAltadBppLr7EpzoiSeE3woNHOtRo0OoY/edit',
            webhookUrl: LIVE_WEBHOOK
          };
        }
      });

      const [syncStatus, setSyncStatus] = useState('idle');
      const [toast, setToast] = useState(null);
      const [modal, setModal] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('orbit_fitness_react_logs', JSON.stringify(logs));
        } catch (e) {}
      }, [logs]);

      useEffect(() => {
        try {
          localStorage.setItem('orbit_fitness_react_settings', JSON.stringify(settings));
        } catch (e) {}
      }, [settings]);

      useEffect(() => {
        if (settings.webhookUrl) {
          syncFromSheetViaJsonp();
        }
      }, [settings.webhookUrl]);

      const showNotification = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      };

      // JSONP GET Request
      const syncFromSheetViaJsonp = () => {
        if (!settings.webhookUrl) return;
        setSyncStatus('syncing');

        const callbackName = 'orbit_cb_' + Date.now();
        window[callbackName] = (response) => {
          delete window[callbackName];
          const scriptTag = document.getElementById('jsonp-temp-script');
          if (scriptTag) scriptTag.remove();

          if (response && response.status === 'success' && response.logs) {
            setLogs((prev) => {
              const merged = { ...prev };
              Object.keys(response.logs).forEach((key) => {
                if (response.logs[key].completed) {
                  merged[key] = {
                    ...merged[key],
                    ...response.logs[key],
                    synced: true
                  };
                }
              });
              return merged;
            });
            setSyncStatus('synced');
            showNotification('Sync complete: Sheet logs loaded!', 'success');
          } else {
            setSyncStatus('error');
          }
        };

        const script = document.createElement('script');
        script.id = 'jsonp-temp-script';
        script.src = `${settings.webhookUrl}${settings.webhookUrl.includes('?') ? '&' : '?'}action=getLogs&callback=${callbackName}&_t=${Date.now()}`;
        script.onerror = () => {
          delete window[callbackName];
          script.remove();
          setSyncStatus('error');
          showNotification('Offline mode: Could not reach Google Apps Script', 'info');
        };
        document.body.appendChild(script);
      };

      // Atomic POST Request to Google Sheet
      const dispatchPostToSheet = async (logEntry) => {
        if (!settings.webhookUrl) {
          showNotification('Saved locally! Add Apps Script Webhook URL in Settings to sync with Google Sheet.', 'info');
          return;
        }
        setSyncStatus('syncing');
        try {
          const payload = {
            date: logEntry.date,
            dayNumber: `Day ${dayNum}`,
            chosen: logEntry.chosen,
            activityDetails: logEntry.activityDetails || logEntry.customText || logEntry.chosen,
            minutes: Number(logEntry.minutes) || 15,
            completed: Boolean(logEntry.completed),
            notes: logEntry.notes || logEntry.feeling || ''
          };

          await fetch(settings.webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          setSyncStatus('synced');
          showNotification('Logged and synced to Google Sheet!', 'success');
        } catch (err) {
          setSyncStatus('error');
          showNotification('Saved locally (Sync pending)', 'info');
        }
      };

      const dateKey = formatDateKey(currentDate);
      const dayIdx = Math.max(0, getDayIndex(currentDate));
      const dayNum = dayIdx + 1;
      const weekIdx = Math.floor(dayIdx / 7) % 4;
      const dayOfWeekIdx = (currentDate.getDay() + 6) % 7;
      const currentRoutine = WEEKLY_SCHEDULE[weekIdx][dayOfWeekIdx] || WEEKLY_SCHEDULE[0][0];

      const currentDayLog = logs[dateKey] || {
        date: dateKey,
        chosen: '',
        completed: false,
        minutes: 15,
        customText: '',
        notes: ''
      };

      const totalCompleted = useMemo(() => {
        return Object.values(logs).filter((l) => l && l.completed).length;
      }, [logs]);

      const totalMinutes = useMemo(() => {
        return Object.values(logs).reduce((acc, l) => acc + (l.completed ? Number(l.minutes || 0) : 0), 0);
      }, [logs]);

      const currentStreak = useMemo(() => {
        let streak = 0;
        let testD = new Date();
        testD.setHours(0, 0, 0, 0);

        const todayK = formatDateKey(testD);
        const yestD = new Date(testD);
        yestD.setDate(yestD.getDate() - 1);
        const yestK = formatDateKey(yestD);

        let runnerKey = logs[todayK]?.completed ? todayK : (logs[yestK]?.completed ? yestK : null);
        if (runnerKey) {
          let runner = new Date(runnerKey === todayK ? testD : yestD);
          while (true) {
            const k = formatDateKey(runner);
            if (logs[k] && logs[k].completed) {
              streak++;
              runner.setDate(runner.getDate() - 1);
            } else {
              break;
            }
          }
        }
        return streak;
      }, [logs]);

      const rankInfo = useMemo(() => {
        if (totalCompleted >= 100) {
          return { title: '🚀 Cosmic Legend', icon: '🚀', pct: 100, next: 'Max Level Unlocked' };
        } else if (totalCompleted >= 50) {
          const p = Math.round(((totalCompleted - 50) / 50) * 100);
          return { title: '🪐 Fleet Commander', icon: '🪐', pct: Math.min(100, Math.max(10, p)), next: `${totalCompleted}/100 to Legend` };
        } else if (totalCompleted >= 25) {
          const p = Math.round(((totalCompleted - 25) / 25) * 100);
          return { title: '✨ Star Navigator', icon: '✨', pct: Math.min(100, Math.max(10, p)), next: `${totalCompleted}/50 to Commander` };
        } else if (totalCompleted >= 10) {
          const p = Math.round(((totalCompleted - 10) / 15) * 100);
          return { title: '🌕 Orbit Explorer', icon: '🌕', pct: Math.min(100, Math.max(10, p)), next: `${totalCompleted}/25 to Navigator` };
        } else {
          const p = Math.round((totalCompleted / 10) * 100);
          return { title: '🛸 Space Cadet', icon: '🛸', pct: Math.min(100, Math.max(10, p)), next: `${totalCompleted}/10 to Explorer` };
        }
      }, [totalCompleted]);

      const handleToggleComplete = (chosenTier, duration) => {
        playAudioTone('success');
        const isAlreadyComplete = currentDayLog.completed && currentDayLog.chosen === chosenTier;
        const details = chosenTier.includes('Option 1') ? currentRoutine.opt1 
                      : chosenTier.includes('Option 2') ? currentRoutine.opt2 
                      : chosenTier.includes('Option 3') ? currentRoutine.opt3 
                      : chosenTier;

        const newLog = {
          ...currentDayLog,
          date: dateKey,
          chosen: isAlreadyComplete ? '' : chosenTier,
          activityDetails: isAlreadyComplete ? '' : details,
          completed: !isAlreadyComplete,
          minutes: duration || currentDayLog.minutes || 15,
          timestamp: new Date().toISOString()
        };

        setLogs((prev) => ({ ...prev, [dateKey]: newLog }));
        dispatchPostToSheet(newLog);
      };

      const handleCustomLog = (text) => {
        playAudioTone('success');
        const customName = text.trim() || 'Custom Movement / Rested';
        const newLog = {
          ...currentDayLog,
          date: dateKey,
          chosen: `Option 4: ${customName}`,
          activityDetails: customName,
          customText: customName,
          completed: true,
          minutes: currentDayLog.minutes || 15,
          timestamp: new Date().toISOString()
        };
        setLogs((prev) => ({ ...prev, [dateKey]: newLog }));
        dispatchPostToSheet(newLog);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-24 sm:p-5 relative">
          
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold shadow-2xl flex items-center gap-2 border backdrop-blur-md transition-all ${
              toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-300 border-emerald-600/70' : 'bg-space-900/95 text-slate-200 border-space-700'
            }`}>
              <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-space-glow'}`}></i>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Header */}
          <header className="flex items-center justify-between pb-4 border-b border-space-800/80">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-space-800 to-space-700 border border-space-gold/50 flex items-center justify-center text-space-gold shadow-md shrink-0">
                <i className="fa-solid fa-satellite text-sm"></i>
              </div>
              <div>
                <h1 className="font-extrabold text-sm tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-space-starlight via-space-gold to-white">
                  ORBIT FITNESS
                </h1>
                <div className="flex items-center gap-1.5 text-[10px] text-slate-400">
                  <span className={`w-1.5 h-1.5 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-400' : syncStatus === 'syncing' ? 'bg-amber-400 animate-ping' : 'bg-slate-500'}`}></span>
                  <span>{syncStatus === 'synced' ? 'Sheet Synced' : syncStatus === 'syncing' ? 'Syncing...' : 'Local Mode'}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <a href={settings.sheetUrl} target="_blank" rel="noopener noreferrer" className="p-2 rounded-lg bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-600/50 text-xs transition" title="Open Google Sheet">
                <i className="fa-solid fa-table-cells"></i>
              </a>
              <button onClick={() => setModal('codex')} className="p-2 rounded-lg bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700 text-xs transition" title="Exercise Codex">
                <i className="fa-solid fa-book-sparkles text-space-gold"></i>
              </button>
              <button onClick={() => setModal('timer')} className="p-2 rounded-lg bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700 text-xs transition" title="Timer">
                <i className="fa-solid fa-stopwatch text-space-glow"></i>
              </button>
              <button onClick={() => setModal('settings')} className="p-2 rounded-lg bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700 text-xs transition" title="Settings">
                <i className="fa-solid fa-gear"></i>
              </button>
            </div>
          </header>

          {/* Gamified Hero Card */}
          <section className="my-4 bg-gradient-to-br from-space-900 via-space-850 to-space-900 rounded-2xl p-4 border border-space-800 shadow-xl relative overflow-hidden">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <span className="text-2xl">{rankInfo.icon}</span>
                <div>
                  <div className="font-bold text-sm text-white">{rankInfo.title}</div>
                  <div className="text-[10px] text-slate-400">{rankInfo.next}</div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-300 font-bold text-xs">
                <i className="fa-solid fa-fire text-amber-400"></i>
                <span>{currentStreak} Streak</span>
              </div>
            </div>

            <div className="w-full bg-space-950 rounded-full h-2 overflow-hidden border border-space-800 mt-2">
              <div className="bg-gradient-to-r from-space-glow via-space-accent to-space-gold h-2 rounded-full transition-all duration-500" style={{ width: `${rankInfo.pct}%` }}></div>
            </div>

            <div className="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-space-800/80 text-center">
              <div>
                <div className="text-base font-black text-white">{totalCompleted}</div>
                <div className="text-[10px] text-slate-400">Active Days</div>
              </div>
              <div>
                <div className="text-base font-black text-space-glow">{totalMinutes}m</div>
                <div className="text-[10px] text-slate-400">Total Moved</div>
              </div>
              <div>
                <div className="text-base font-black text-emerald-400">{Math.max(0, 182 - totalCompleted)}</div>
                <div className="text-[10px] text-slate-400">Days to Goal</div>
              </div>
            </div>
          </section>

          {/* Date Navigator & Today Button */}
          <div className="flex items-center justify-between bg-space-900 rounded-xl p-3 border border-space-800 mb-3">
            <button onClick={() => {
              const d = new Date(currentDate);
              d.setDate(d.getDate() - 1);
              setCurrentDate(d);
              playAudioTone('tap');
            }} className="p-2 rounded-lg bg-space-850 hover:bg-space-800 border border-space-700 text-slate-300">
              <i className="fa-solid fa-chevron-left text-xs"></i>
            </button>

            <div className="text-center cursor-pointer" onClick={() => {
              const d = new Date();
              d.setHours(0,0,0,0);
              setCurrentDate(d);
              playAudioTone('tap');
            }}>
              <div className="font-bold text-sm text-white flex items-center justify-center gap-1.5">
                <span>{currentDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
                <span className="text-[9px] px-1.5 py-0.2 rounded bg-space-800 text-space-glow border border-space-700">Today</span>
              </div>
              <div className="text-[10px] text-space-gold font-mono">Day {dayNum} • {currentRoutine.focus}</div>
            </div>

            <button onClick={() => {
              const d = new Date(currentDate);
              d.setDate(d.getDate() + 1);
              setCurrentDate(d);
              playAudioTone('tap');
            }} className="p-2 rounded-lg bg-space-850 hover:bg-space-800 border border-space-700 text-slate-300">
              <i className="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>

          {/* 3 Workouts Checklist Tiers */}
          <div className="space-y-3 flex-1">
            
            {/* Option 1: Orbit Cruise */}
            <div onClick={() => handleToggleComplete('Option 1 (Orbit Cruise)', 12)} className={`rounded-xl p-3.5 border transition cursor-pointer select-none relative ${
              currentDayLog.completed && currentDayLog.chosen.includes('Option 1') 
                ? 'bg-emerald-950/40 border-emerald-500 shadow-md shadow-emerald-500/10' 
                : 'bg-space-900 border-space-800 hover:border-emerald-700/60'
            }`}>
              <div className="flex items-start justify-between gap-3">
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">
                      Option 1: Orbit Cruise
                    </span>
                    <span className="text-[10px] text-slate-400 font-semibold">10–12m</span>
                  </div>
                  <p className="text-xs text-slate-200 leading-snug">{currentRoutine.opt1}</p>
                </div>
                <div className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border transition ${
                  currentDayLog.completed && currentDayLog.chosen.includes('Option 1')
                    ? 'bg-emerald-500 border-emerald-400 text-space-950'
                    : 'border-slate-600 bg-space-950'
                }`}>
                  {currentDayLog.completed && currentDayLog.chosen.includes('Option 1') && <i className="fa-solid fa-check text-xs font-black"></i>}
                </div>
              </div>
            </div>

            {/* Option 2: Stellar Stride */}
            <div onClick={() => handleToggleComplete('Option 2 (Stellar Stride)', 15)} className={`rounded-xl p-3.5 border transition cursor-pointer select-none relative ${
              currentDayLog.completed && currentDayLog.chosen.includes('Option 2') 
                ? 'bg-blue-950/40 border-blue-500 shadow-md shadow-blue-500/10' 
                : 'bg-space-900 border-space-800 hover:border-blue-700/60'
            }`}>
              <div className="flex items-start justify-between gap-3">
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">
                      Option 2: Stellar Stride
                    </span>
                    <span className="text-[10px] text-slate-400 font-semibold">15m</span>
                  </div>
                  <p className="text-xs text-slate-200 leading-snug">{currentRoutine.opt2}</p>
                </div>
                <div className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border transition ${
                  currentDayLog.completed && currentDayLog.chosen.includes('Option 2')
                    ? 'bg-blue-500 border-blue-400 text-space-950'
                    : 'border-slate-600 bg-space-950'
                }`}>
                  {currentDayLog.completed && currentDayLog.chosen.includes('Option 2') && <i className="fa-solid fa-check text-xs font-black"></i>}
                </div>
              </div>
            </div>

            {/* Option 3: Rocket Boost */}
            <div onClick={() => handleToggleComplete('Option 3 (Rocket Boost)', 18)} className={`rounded-xl p-3.5 border transition cursor-pointer select-none relative ${
              currentDayLog.completed && currentDayLog.chosen.includes('Option 3') 
                ? 'bg-amber-950/40 border-amber-500 shadow-md shadow-amber-500/10' 
                : 'bg-space-900 border-space-800 hover:border-amber-700/60'
            }`}>
              <div className="flex items-start justify-between gap-3">
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800">
                      Option 3: Rocket Boost
                    </span>
                    <span className="text-[10px] text-slate-400 font-semibold">18–20m</span>
                  </div>
                  <p className="text-xs text-slate-200 leading-snug">{currentRoutine.opt3}</p>
                </div>
                <div className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 border transition ${
                  currentDayLog.completed && currentDayLog.chosen.includes('Option 3')
                    ? 'bg-amber-500 border-amber-400 text-space-950'
                    : 'border-slate-600 bg-space-950'
                }`}>
                  {currentDayLog.completed && currentDayLog.chosen.includes('Option 3') && <i className="fa-solid fa-check text-xs font-black"></i>}
                </div>
              </div>
            </div>

            {/* Option 4: Custom / Other */}
            <div className={`rounded-xl p-3.5 border transition space-y-2.5 ${
              currentDayLog.completed && currentDayLog.chosen.includes('Option 4')
                ? 'bg-purple-950/40 border-purple-500 shadow-md'
                : 'bg-space-900 border-space-800'
            }`}>
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-space-800 text-space-starlight border border-space-700">
                  Option 4: Custom / Other
                </span>
                <span className="text-[10px] text-slate-400">Fill in the blank</span>
              </div>

              <div className="flex items-center gap-1.5 flex-wrap">
                <button type="button" onClick={() => handleCustomLog('Played soccer match / practice')} className="text-[10px] px-2 py-0.5 rounded bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700">
                  ⚽ Played Soccer
                </button>
                <button type="button" onClick={() => handleCustomLog('Sick with cold. Rested & recovered')} className="text-[10px] px-2 py-0.5 rounded bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700">
                  🛌 Sick / Rested
                </button>
                <button type="button" onClick={() => handleCustomLog('Outdoor bike ride with family')} className="text-[10px] px-2 py-0.5 rounded bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700">
                  🚴 Bike Ride
                </button>
                <button type="button" onClick={() => handleCustomLog('Walking outside with dog')} className="text-[10px] px-2 py-0.5 rounded bg-space-850 hover:bg-space-800 text-slate-300 border border-space-700">
                  🚶 Outside Walk
                </button>
              </div>

              <div className="flex gap-2">
                <input 
                  type="text" 
                  id="custom-input-box"
                  defaultValue={currentDayLog.customText || ''} 
                  placeholder="e.g. Played soccer, rested today..."
                  className="flex-1 bg-space-950 border border-space-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-space-gold"
                />
                <button 
                  type="button" 
                  onClick={() => {
                    const el = document.getElementById('custom-input-box');
                    handleCustomLog(el ? el.value : '');
                  }}
                  className="px-3 py-1.5 rounded-lg bg-space-800 hover:bg-space-700 text-xs font-bold text-space-starlight border border-space-700"
                >
                  Log
                </button>
              </div>
            </div>

          </div>

          {/* Modal: Exercise Codex */}
          {modal === 'codex' && (
            <div className="fixed inset-0 z-50 bg-space-950/80 backdrop-blur-sm p-4 flex items-center justify-center">
              <div className="bg-space-900 border border-space-700 rounded-2xl w-full max-w-lg max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-space-800 flex items-center justify-between bg-space-850">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-book-sparkles text-space-gold"></i>
                    <h2 className="font-bold text-sm text-white">Goalkeeper Exercise Codex</h2>
                  </div>
                  <button onClick={() => setModal(null)} className="p-1 text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <div className="p-3 overflow-y-auto space-y-3 custom-scroll">
                  {EXERCISE_CODEX.map(ex => (
                    <div key={ex.id} className="p-3 bg-space-950 rounded-xl border border-space-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-space-850 text-space-glow border border-space-700">{ex.equipment}</span>
                        <a href={ex.url} target="_blank" rel="noopener noreferrer" className="text-[11px] font-bold text-red-400 hover:text-red-300 flex items-center gap-1">
                          <i className="fa-brands fa-youtube"></i> Form Video
                        </a>
                      </div>
                      <div className="font-bold text-xs text-white">{ex.name}</div>
                      <div className="text-[11px] text-slate-300 leading-snug">{ex.desc}</div>
                      <div className="text-[10px] text-emerald-400 bg-space-900 p-2 rounded-lg border border-space-800">
                        <strong>🥅 Goalie Benefit:</strong> {ex.benefit}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Modal: Timer */}
          {modal === 'timer' && (
            <div className="fixed inset-0 z-50 bg-space-950/80 backdrop-blur-sm p-4 flex items-center justify-center">
              <div className="bg-space-900 border border-space-700 rounded-2xl w-full max-w-sm p-5 text-center shadow-2xl relative">
                <button onClick={() => setModal(null)} className="absolute top-3 right-3 text-slate-400 hover:text-white p-1">
                  <i className="fa-solid fa-xmark text-lg"></i>
                </button>
                <div className="w-10 h-10 rounded-full bg-space-glow/10 border border-space-glow/40 flex items-center justify-center text-space-glow mx-auto mb-2">
                  <i className="fa-solid fa-stopwatch text-lg"></i>
                </div>
                <h3 className="font-bold text-base text-white mb-1">Mission Timer</h3>
                <p className="text-[11px] text-slate-400 mb-4">Focus and complete your daily movement</p>

                <TimerComponent onFinish={() => {
                  playAudioTone('timer');
                  showNotification('Timer completed! Great work!', 'success');
                }} />
              </div>
            </div>
          )}

          {/* Modal: Settings */}
          {modal === 'settings' && (
            <div className="fixed inset-0 z-50 bg-space-950/80 backdrop-blur-sm p-4 flex items-center justify-center">
              <div className="bg-space-900 border border-space-700 rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-space-800 pb-2.5">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-gear text-space-gold"></i>
                    <h3 className="font-bold text-sm text-white">Google Sheet Sync Settings</h3>
                  </div>
                  <button onClick={() => setModal(null)} className="text-slate-400 hover:text-white p-1">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300">
                  <div>
                    <label className="block font-semibold text-white mb-1">Google Sheet URL</label>
                    <input 
                      type="text" 
                      id="settings-sheet-url"
                      defaultValue={settings.sheetUrl} 
                      className="w-full bg-space-950 border border-space-700 rounded-lg p-2 text-xs text-slate-200"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-white mb-1">Google Apps Script Web App URL</label>
                    <input 
                      type="text" 
                      id="settings-webhook-url"
                      defaultValue={settings.webhookUrl} 
                      placeholder="https://script.google.com/macros/s/.../exec"
                      className="w-full bg-space-950 border border-space-700 rounded-lg p-2 text-xs text-slate-200"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">
                      Paste the Web App URL from Apps Script deployment to enable real-time bidirectional syncing.
                    </p>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button onClick={() => {
                      const sUrl = document.getElementById('settings-sheet-url').value.trim();
                      const wUrl = document.getElementById('settings-webhook-url').value.trim();
                      setSettings({ sheetUrl: sUrl, webhookUrl: wUrl });
                      showNotification('Settings saved!', 'success');
                      setModal(null);
                    }} className="flex-1 py-2 bg-space-gold hover:bg-amber-400 text-space-950 font-bold rounded-lg text-xs">
                      Save Settings
                    </button>
                    <button onClick={syncFromSheetViaJsonp} className="px-3 py-2 bg-space-800 hover:bg-space-700 text-white rounded-lg text-xs border border-space-700">
                      Sync Now
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function TimerComponent({ onFinish }) {
      const [seconds, setSeconds] = useState(900);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        let t = null;
        if (running && seconds > 0) {
          t = setInterval(() => setSeconds(s => s - 1), 1000);
        } else if (running && seconds === 0) {
          setRunning(false);
          if (onFinish) onFinish();
        }
        return () => clearInterval(t);
      }, [running, seconds]);

      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      const formatted = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      return (
        <div className="space-y-4">
          <div className="font-mono text-4xl font-black text-space-gold tracking-widest">{formatted}</div>
          <div className="flex justify-center gap-1.5">
            {[600, 720, 900, 1080, 1200].map(sec => (
              <button 
                key={sec} 
                onClick={() => { setSeconds(sec); setRunning(false); }}
                className={`text-[10px] font-bold px-2 py-1 rounded border ${seconds === sec ? 'bg-space-gold text-space-950 border-space-gold' : 'bg-space-800 text-slate-300 border-space-700'}`}
              >
                {sec / 60}m
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            <button 
              onClick={() => setRunning(!running)} 
              className={`flex-1 py-2 rounded-xl font-black text-xs ${running ? 'bg-amber-500 text-space-950' : 'bg-space-glow text-space-950'}`}
            >
              {running ? 'Pause' : 'Start'}
            </button>
            <button 
              onClick={() => { setRunning(false); setSeconds(900); }} 
              className="px-4 py-2 rounded-xl bg-space-800 text-slate-300 font-bold text-xs border border-space-700"
            >
              Reset
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
